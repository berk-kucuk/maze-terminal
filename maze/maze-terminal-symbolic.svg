  </defs>
  <path d="M290 290 H400 L622 512 H512 Z" fill="url(#lit)"/>
  <path d="M512 512 H622 L400 734 H290 Z" fill="url(#shade)"/>
  <rect x="650" y="680" width="120" height="54" fill="#f2f2f4"/>
