<svg xmlns="http://www.w3.org/2000/svg" viewBox="270 270 520 484" width="24" height="24">
  <title>Maze Terminal</title>
  <!-- The app icon's mark without the tile, for the window header. -->
  <defs>
    <linearGradient id="lit" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d4d4da"/>
    </linearGradient>
    <linearGradient id="shade" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8e8e96"/>
      <stop offset="1" stop-color="#4a4a50"/>
